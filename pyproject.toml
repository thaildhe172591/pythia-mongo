[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pythia-mongo"
version = "0.1.0"
description = "pythia for MongoDB: database development for AI agents over pythia-core - validators, views and indexes read live, impact with its blind spots named, and an approved write path."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
# pythia-core and the driver, nothing else (tests/test_mongo.py).
dependencies = ["pythia-core>=0.1.0,<0.2", "pymongo>=4.9"]
keywords = ["mongodb", "database", "agent-skills"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development",
]

[project.urls]
Repository = "https://github.com/thaildhe172591/pythia-mongo"
Changelog = "https://github.com/thaildhe172591/pythia-mongo/blob/main/CHANGELOG.md"
Issues = "https://github.com/thaildhe172591/pythia-mongo/issues"

[project.scripts]
pythia-mongo = "pythia_mongo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pythia_mongo = ["commands/*.json", "skills/*/SKILL.md", "skills/*/reference/*.md"]
